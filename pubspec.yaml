name: asso
description: "Asso market place app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.9+10

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_storage: ^2.1.1
  rename_app: ^1.6.5
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.3
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  dotted_border: ^2.1.0
  url_launcher: ^6.2.5
  shimmer: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  cached_network_image: ^3.3.1
  webview_flutter: ^4.13.1
  share_plus: ^10.1.3
  # Liens universels : ouvre l'app sur un lien https://asso-dashboard.sbs/produit/{id}
  app_links: ^6.3.2
  # WebSocket natif pour Reverb
  web_socket_channel: ^3.0.1
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.2.0
  timeago: ^3.7.0
  flutter_markdown: ^0.7.4+1
  dio: ^5.9.2
  http_parser: ^4.0.2
  # Paiement carte natif (Payment Sheet) — remplace l'ancien parcours stripe_direct WebView
  flutter_stripe: ^11.5.0
  fl_chart: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0
  upgrader: ^13.7.0
  video_player: ^2.14.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  get_cli: ^1.9.1
  flutter_launcher_icons: ^0.14.1
  video_player_platform_interface: ^6.9.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/lotties/
    - assets/svgs/categories/
    - Politique de confidentialité.md
    - shorebird.yaml

  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SF-Pro/SF-Pro.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # Configuration iOS
  remove_alpha_ios: true
  # Configuration Android
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
